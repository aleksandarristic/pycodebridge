discord:
  token_env: "DISCORD_TOKEN"
  guild_id: "123456789012345678"
  allowed_user_ids: ["1234567890"]
  prefix: "!c"
  channel_name_regex: "^codex-([A-Za-z0-9._-]+)$"
  allow_plain_prompts: false
  dm_admin_enabled: false
  dm_admin_user_ids: []
  totp:
    enabled: false
    secret_env: "DISCORD_TOTP_SECRET"
    window: 1
    limiter:
      max_failures: 5
      failure_window_seconds: 300
      cooldown_seconds: 300
    command_groups:
      git: true
      gh: true
      high_risk: true
  max_discord_message_chars: 1800

codex:
  binary: "codex"
  code_root: "/workspace/code_root"
  sandbox: "danger-full-access"
  ask_for_approval: "on-request"  # untrusted|on-failure|on-request|never
  network_access: false  # when true, adds -c sandbox_workspace_write.network_access=true
  json: true
  model: ""  # recommended default: gpt-5.4 (routine), gpt-5.5 (complex)
  model_reasoning_effort: ""  # recommended: medium (routine), high (complex)
  start_prompt: |
    Discord bridge session for {{REPO_NAME}}. Work only in this repo and keep replies concise.
  env: {}

state:
  data_dir: "/workspace/state"
  lock_timeout_seconds: 600
  conflict_ttl_seconds: 60
  session_idle_ttl_seconds: 0  # disabled when 0; otherwise prompt continue/new after idle TTL
  log_dir: "/workspace/state/logs"

runtime:
  log_level: "info"
  health_bind: ""
  health_path: "/healthz"
  run_heartbeat_seconds: 120
  run_completion_min_seconds: 300
  show_reasoning_details: true

audit:
  redact: false
  redact_patterns: []

transport:
  adapter: "discord"

git:
  enabled: false
  user_name: ""
  user_email: ""
  credential_helper: "!gh auth git-credential"
  global_config_path: ""
  apply_on_startup: true
  apply_to_existing_repos: true
  apply_on_repo_create_clone_copy: true
  local_fallback_on_global_failure: true
  allow_dangerous_ops: false
  require_confirmation_for_dangerous_ops: true
  dangerous_confirmation_token: "--confirm-dangerous"

files:
  max_upload_mb: 200

repo_bootstrap:
  agents_template: ""
  spec_prompt: ""  # optional prompt profile override for `!c spec`
