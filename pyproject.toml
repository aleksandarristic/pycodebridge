[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycodebridge"
version = "0.1.0"
description = "Discord ↔ Codex CLI bridge (Python)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [{name = "pycodebridge"}]

dependencies = [
  "discord.py>=2.4.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  "filelock>=3.13.1",
]

[project.optional-dependencies]
 dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["codebridge*"]

