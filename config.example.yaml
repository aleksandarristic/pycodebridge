discord:
  token_env: "DISCORD_TOKEN"
  guild_id: "123456789012345678"
  allowed_user_ids: ["1234567890"]
  prefix: "!c"
  channel_name_regex: "^code-([A-Za-z0-9._-]+)$"
  allow_plain_prompts: false
  dm_admin_enabled: false
  dm_admin_user_ids: []
  totp:
    enabled: false
    secret_env: "DISCORD_TOTP_SECRET"
    window: 1
    limiter:
      max_failures: 5
      failure_window_seconds: 300
      cooldown_seconds: 300
    command_groups:
      git: true
      gh: true
      high_risk: true
      file_transfer: true
  max_discord_message_chars: 1800

codex:
  binary: "codex"
  code_root: "/home/you/Code"
  sandbox: "workspace-write"
  ask_for_approval: "on-request"  # untrusted|on-failure|on-request|never
  network_access: false  # when true, adds -c sandbox_workspace_write.network_access=true
  json: true
  model: ""  # recommended default: gpt-5.4 (routine), gpt-5.5 (complex)
  # Default reasoning effort. minimal = lowest token spend (good default for a
  # chat bridge); raise to low/medium/high/xhigh for harder tasks. Override per
  # session with `!c model [session] <id> [reasoning]`. Empty = Codex default.
  model_reasoning_effort: "minimal"
  start_prompt: |
    Discord bridge session for {{REPO_NAME}}. Work only in this repo and keep replies concise.
  env: {}

# gemini:
#   binary: "gemini"
#   approval_mode: "yolo"
#   model: ""
#   api_key_env: "GEMINI_API_KEY"  # host env var to read; passed to Gemini as GEMINI_API_KEY
#   env: {}

# dm_assistant:
#   enabled: false  # route unbound DM messages to the bridge assistant
#   default_backend: ""  # empty falls back to agent.default_backend
#   model: ""  # optional assistant model override
#   effort: ""  # optional assistant effort/reasoning override
#   memory_dir: ""  # empty falls back to {state.data_dir}/dm-memory/
#   start_prompt: |  # optional template; supports {{REPO_PATH}}, {{CODE_ROOT}}, {{MEMORY_FILE}}, {{USER_ID}}
#     You are the pycodebridge assistant. You have access to the pycodebridge repo at {{REPO_PATH}}. Answer questions about the bridge configuration, running sessions, and managed repos. Read docs on demand as needed.

state:
  data_dir: "/home/you/.discord-codex-bridge"
  lock_timeout_seconds: 600
  conflict_ttl_seconds: 60
  session_idle_ttl_seconds: 14400  # default 4h; set 0 to disable expiry and continue/compact/new prompting
  log_dir: "/home/you/.discord-codex-bridge/logs"

runtime:
  log_level: "info"
  health_bind: ""
  health_allow_public: false
  health_path: "/healthz"
  run_heartbeat_seconds: 120
  run_completion_min_seconds: 300
  show_reasoning_details: true
  # Idle window (seconds) for coalescing streamed Codex output into fewer
  # Discord sends. Higher = fewer messages / less rate-limit pressure but
  # slightly more latency; 0 disables coalescing (send each event immediately).
  output_flush_seconds: 0.4

audit:
  redact: false
  redact_patterns: []

transport:
  adapter: "discord"

git:
  enabled: false
  user_name: ""
  user_email: ""
  credential_helper: "!gh auth git-credential"
  global_config_path: ""
  apply_on_startup: true
  apply_to_existing_repos: true
  apply_on_repo_create_clone_copy: true
  local_fallback_on_global_failure: true
  allow_dangerous_ops: false
  require_confirmation_for_dangerous_ops: true
  dangerous_confirmation_token: "--confirm-dangerous"

files:
  max_upload_mb: 200
  max_upload_total_mb: 200
  max_upload_count: 20

repo_bootstrap:
  agents_template: ""
  spec_prompt: ""  # optional prompt profile override for `!c spec`

dispatch:
  # Controls what the bot posts during and after a multi-agent run.
  #   per_agent  — status message per agent on start and finish
  #   aggregate  — single summary after all agents complete
  #   both       — per-agent messages AND an aggregate summary (default)
  output_mode: both

  # What happens when the user runs `!c done`.
  #   pr     — push task branch and open a draft PR (default, review on GitHub)
  #   merge  — merge task branch into main locally and push
  close_mode: pr

  # Prompt template fed to Claude when it orchestrates a fan-out.
  # {{USER_REQUEST}} and {{AGENTS}} are substituted at runtime.
  # plan_prompt: |
  #   You are the orchestrator for a multi-agent coding session...

worktrees:
  # Give each session its own git worktree so concurrent sessions on the same
  # repo cannot interfere with each other's uncommitted changes.
  enabled: false

  # Directory where worktree copies are created.
  # Leave empty to create them as siblings of the repo directory
  # (e.g. /home/you/Code/myapp-wt-<session-key>/).
  base_dir: ""

  # Refuse to create a new session if this many worktrees already exist for
  # the repo. Protects against runaway session accumulation.
  max_per_repo: 8

  # What to do with the worktree when the session run ends.
  #   remove — delete the worktree directory (default, clean operation)
  #   keep   — leave the branch and directory for manual inspection or PR
  #   pr     — (future) push branch and open a draft PR, then remove
  cleanup_on_end: remove
